<svg xmlns="http://www.w3.org/2000/svg" width="600" height="535" viewBox="0 0 600 535"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176f72"/></marker></defs><rect width="600" height="535" rx="16" fill="#f4f7f7"/><text x="28" y="48" font-family="SimHei" font-size="28" fill="#176f72" text-anchor="start">从类型布局到内存地址</text><rect x="28" y="82" width="544" height="110" rx="14" fill="white" stroke="#bfd1d2" stroke-width="2"/><text x="48" y="120" font-family="SimHei" font-size="25" fill="#176f72" text-anchor="start">一条记录：float3 的示意</text><text x="48" y="155" font-family="SimHei" font-size="22" fill="#233c49" text-anchor="start">有效分量 12 字节；对齐 16 字节</text><rect x="28" y="225" width="136" height="66" fill="#176f72" stroke="white"/><text x="96" y="269" font-family="SimHei" font-size="25" fill="white" text-anchor="middle">x</text><rect x="164" y="225" width="136" height="66" fill="#176f72" stroke="white"/><text x="232" y="269" font-family="SimHei" font-size="25" fill="white" text-anchor="middle">y</text><rect x="300" y="225" width="136" height="66" fill="#176f72" stroke="white"/><text x="368" y="269" font-family="SimHei" font-size="25" fill="white" text-anchor="middle">z</text><rect x="436" y="225" width="136" height="66" fill="#bfd1d2" stroke="white"/><text x="504" y="269" font-family="SimHei" font-size="25" fill="#233c49" text-anchor="middle">空白</text><rect x="28" y="330" width="544" height="143" rx="14" fill="white" stroke="#bfd1d2" stroke-width="2"/><text x="48" y="368" font-family="SimHei" font-size="25" fill="#176f72" text-anchor="start">访问第 i 条记录的字段</text><text x="48" y="403" font-family="SimHei" font-size="22" fill="#233c49" text-anchor="start">起点 + i × stride + 字段偏移</text><text x="48" y="435" font-family="SimHei" font-size="22" fill="#233c49" text-anchor="start">stride 描述记录；偏移描述字段</text><text x="28" y="515" font-family="SimHei" font-size="17" fill="#5c7078" text-anchor="st