<svg xmlns="http://www.w3.org/2000/svg" width="560" height="742">
<rect x="0" y="0" width="560" height="742" rx="0" fill="#f7fafb" stroke="#f7fafb"/>
<text x="22" y="42" fill="#147d86" font-size="31">三个源文件怎样编译</text>
<rect x="20" y="90" width="520" height="102" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="126" fill="#147d86" font-size="27">B / 自己写的两个文件</text>
<text x="38" y="167" fill="#263746" font-size="25">numbers.h + numbers.b</text>
<line x1="280" y1="196" x2="280" y2="211" stroke="#147d86" stroke-width="2"/>
<rect x="20" y="216" width="520" height="174" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="252" fill="#147d86" font-size="27">blc build-dll / 生成</text>
<text x="38" y="293" fill="#263746" font-size="25">numbers.dll + numbers.lib</text>
<text x="38" y="329" fill="#263746" font-size="25">numbers.rs / Rust 调用接口</text>
<text x="38" y="365" fill="#263746" font-size="25">numbers.abi.h / C++ 调用接口</text>
<line x1="280" y1="394" x2="280" y2="409" stroke="#147d86" stroke-width="2"/>
<rect x="20" y="414" width="520" height="138" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="450" fill="#147d86" font-size="27">Rust / 自己写的 main.rs</text>
<text x="38" y="491" fill="#263746" font-size="25">mod numbers 引入生成接口</text>
<text x="38" y="527" fill="#263746" font-size="25">rustc 编译并链接 numbers.lib</text>
<line x1="280" y1="556" x2="280" y2="571" stroke="#147d86" stroke-width="2"/>
<rect x="20" y="576" width="520" height="102" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="612" fill="#147d86" font-size="27">最后运行</text>
<text x="38" y="653" fill="#263746" font-size="25">numbers.exe 加载 numbers.dll</text>
<text x="22" y="718" fill="#657787" font-size="20">执行顺序示意 · 连线不表示耗时</text>
</svg>
