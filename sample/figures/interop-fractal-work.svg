<text x="538" y="742" font-size="26" fill="#263746">写回 iteration</text>
<text x="28" y="833" font-size="28" fill="#263746">CPU 核心／GPU 执行单元承担像素域。</text>
<text x="28" y="877" font-size="27" fill="#657787">箭头表示依赖，长度不代表耗时。</text>
