<text x="38" y="420" font-size="30" fill="#263746">像素 0 / c</text>
<line x1="130" y1="452" x2="130" y2="487" stroke="#147d86" stroke-width="3" />
<line x1="122" y1="475" x2="130" y2="487" stroke="#147d86" stroke-width="3" />
<line x1="138" y1="475" x2="130" y2="487" stroke="#147d86" stroke-width="3" />
<rect x="20" y="495" width="220" height="150" rx="12" fill="#ffffff" stroke="#d9e4eb" />
<text x="38" y="538" font-size="30" fill="#147d86">z = z*z + c</text>
<text x="38" y="585" font-size="29" fill="#263746">继续或退出</text>
<text x="38" y="625" font-size="26" fill="#657787">只影响本像素</text>
