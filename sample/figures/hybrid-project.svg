<svg xmlns="http://www.w3.org/2000/svg" width="560" height="544">
<rect x="0" y="0" width="560" height="544" rx="0" fill="#f7fafb" stroke="#f7fafb"/>
<text x="22" y="42" fill="#147d86" font-size="31">从 B 算法到图片文件</text>
<rect x="20" y="90" width="520" height="102" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="126" fill="#147d86" font-size="27">B / prepare + shade</text>
<text x="38" y="167" fill="#263746" font-size="25">生成采样参数 → GGX → radiance</text>
<line x1="280" y1="196" x2="280" y2="211" stroke="#147d86" stroke-width="2"/>
<rect x="20" y="216" width="520" height="102" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="252" fill="#147d86" font-size="27">B / pack + resolve</text>
<text x="38" y="293" fill="#263746" font-size="25">整理颜色 → 显示转换 → BGRA</text>
<line x1="280" y1="322" x2="280" y2="337" stroke="#147d86" stroke-width="2"/>
