<svg xmlns="http://www.w3.org/2000/svg" width="560" height="634">
<rect x="0" y="0" width="560" height="634" rx="0" fill="#f7fafb" stroke="#f7fafb"/>
<text x="22" y="42" fill="#147d86" font-size="31">一个粒子怎样存放</text>
<rect x="20" y="90" width="520" height="102" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="126" fill="#147d86" font-size="27">字节 0-11 / position</text>
<text x="38" y="167" fill="#263746" font-size="25">word 0、1、2 / x、y、z</text>
<rect x="20" y="216" width="520" height="102" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="252" fill="#147d86" font-size="27">字节 12-15 / 间隔</text>
<text x="38" y="293" fill="#263746" font-size="25">下一个字段从字节 16 开始</text>
<rect x="20" y="342" width="520" height="102" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="378" fill="#147d86" font-size="27">字节 16-27 / velocity</text>
<text x="38" y="419" fill="#263746" font-size="25">word 4、5、6 / x、y、z</text>
<rect x="20" y="468" width="520" height="102" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="504" fill="#147d86" font-size="27">字节 28-31 / energy</text>
<text x="38" y="545" fill="#263746" font-size="25">word 7 / 一个 f32 动能</text>
<text x="22" y="610" fill="#657787" font-size="20">每条记录 32 字节 · 来自实际布局查询</text>
</svg>
