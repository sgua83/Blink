<svg xmlns="http://www.w3.org/2000/svg" width="680" height="501"><rect x="0" y="0" width="680" height="501" rx="12" fill="#f7fafb" stroke="#d9e4eb"/><text x="26" y="48" font-size="34" fill="#147d86">同一份数据，按依赖往下走</text><rect x="26" y="82" width="628" height="107" rx="10" fill="#ffffff" stroke="#d9e4eb"/><text x="44" y="115" font-size="28" fill="#147d86">seed / 先填写</text><text x="44" y="157" font-size="32" fill="#263746">numbers = [1, 2, 3, 4]</text><rect x="26" y="209" width="628" height="107" rx="10" fill="#ffffff" stroke="#d9e4eb"/><text x="44" y="242" font-size="28" fill="#147d86">scale / 读取并改写</text><text x="44" y="284" font-size="32" fill="#263746">每项乘二加一</text><rect x="26" y="336" width="628" height="107" rx="10" fill="#ffffff" stroke="#d9e4eb"/><text x="44" y="369" font-size="28" fill="#147d86">结果</text><text x="44" y="411" font-size="32" fill="#263746">numbers = [3, 5, 7, 9]</text><text x="26" y="475" font-size="17" fill="#657787">B 语言编程 · 2026-10-26</text></svg>
