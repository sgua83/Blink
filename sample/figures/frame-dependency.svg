<svg xmlns="http://www.w3.org/2000/svg" width="600" height="652" viewBox="0 0 600 652" font-family="SimHei"><text x="26" y="43" font-size="30" fill="#147d86">计算链：阶段内展开，阶段间依赖</text><rect x="20" y="76" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="113" font-size="28" fill="#147d86">串行视角</text><text x="40" y="157" font-size="27" fill="#253e53">先逐个生产 pixels</text><text x="40" y="196" font-size="27" fill="#253e53">再逐个读取 pixels，生成 display</text><rect x="20" y="255" width="560" height="192" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="292" font-size="28" fill="#147d86">B 的阶段视角</text><text x="40" y="336" font-size="27" fill="#253e53">trace：大量元素实例产生 pixels</text><text x="40" y="375" font-size="27" fill="#253e53">设备依赖：写入对消费者可见</text><text x="40" y="414" font-size="27" fill="#253e53">resolve：大量输出各自读取并转换</text><rect x="20" y="473" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="510" font-size="28" fill="#147d86">完成与资源寿命</text><text x="40" y="554" font-size="27" fill="#253e53">提交返回：设备可能仍在计算</text><text x="40" y="593" font-size="27" fill="#253e53">最后一个消费者完成后才释放资源</text></svg>