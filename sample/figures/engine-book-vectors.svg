<svg xmlns="http://www.w3.org/2000/svg" width="680" height="710" viewBox="0 0 680 710"><rect x="1" y="1" width="678" height="708" rx="18" fill="#fbfdfe" stroke="#cadde3"/><text x="30" y="57" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="36" fill="#147d86">向量：夹角、面积与朝向</text><line x1="95" y1="305" x2="510" y2="305" stroke="#147d86" stroke-width="4"/><polygon points="510.00,305.00 496.30,311.12 496.30,298.88" fill="#147d86" stroke="#147d86" stroke-width="3"/><line x1="95" y1="305" x2="95" y2="115" stroke="#147d86" stroke-width="4"/><polygon points="95.00,115.00 101.12,128.70 88.88,128.70" fill="#147d86" stroke="#147d86" stroke-width="3"/><line x1="95" y1="305" x2="355" y2="155" stroke="#b77835" stroke-width="4"/><polygon points="355.00,155.00 346.19,167.14 340.08,156.55" fill="#b77835" stroke="#b77835" stroke-width="3"/><text x="523" y="315" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="32" fill="#263746">a</text><text x="54" y="110" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="32" fill="#263746">y</text><text x="367" y="155" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="32" fill="#b77835">b</text><text x="195" y="272" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="28" fill="#263746">夹角 θ</text><rect x="30" y="355" width="620" height="125" rx="12" fill="#eef5f7" stroke="#cadde3"/><text x="50" y="397" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="32" fill="#147d86">点积 a·b = |a||b|cosθ</text><text x="50" y="440" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="28" fill="#263746">同向为正，垂直为零</text><polygon points="130.00,620.00 500.00,620.00 305.00,510.00" fill="#eef5f7" stroke="#147d86" stroke-width="3"/><line x1="305" y1="585" x2="305" y2="485" stroke="#b77835" stroke-width="4"/><polygon points="305.00,485.00 311.12,498.70 298.88,498.70" fill="#b77835" stroke="#b77835" stroke-width="3"/><text x="330" y="530" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="29" fill="#b77835">法线 n</text><text x="63" y="675" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="30" fill="#263746">叉积方向由边的先后顺序决定</text></svg>