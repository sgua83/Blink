<svg xmlns="http://www.w3.org/2000/svg" width="600" height="652" viewBox="0 0 600 652" font-family="SimHei"><text x="26" y="43" font-size="30" fill="#147d86">同一批工作，经过不同阶段</text><rect x="20" y="76" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="113" font-size="28" fill="#147d86">筛选：只留下有效记录</text><text x="40" y="157" font-size="27" fill="#253e53">input → selected</text><text x="40" y="196" font-size="27" fill="#253e53">id：[0, 2, 4, 6]；count=4</text><rect x="20" y="255" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="292" font-size="28" fill="#147d86">排序：按 key 稳定编排</text><text x="40" y="336" font-size="27" fill="#253e53">key：[2, 1, 0, 2] → [0, 1, 2, 2]</text><text x="40" y="375" font-size="27" fill="#253e53">id：[4, 2, 0, 6]</text><rect x="20" y="434" width="560" height="192" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="471" font-size="28" fill="#147d86">统计：消费同一个有效前缀</text><text x="40" y="515" font-size="27" fill="#253e53">units：[5, 3, 1, 7]</text><text x="40" y="554" font-size="27" fill="#253e53">scan → [0, 5, 8, 9]</text><text x="40" y="593" font-size="27" fill="#253e53">reduce → 16</text></svg>