<svg xmlns="http://www.w3.org/2000/svg" width="600" height="625" viewBox="0 0 600 625"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176f72"/></marker></defs><rect width="600" height="625" rx="16" fill="#f4f7f7"/><text x="28" y="48" font-family="SimHei" font-size="28" fill="#176f72" text-anchor="start">阶段融合依赖真实读写关系</text><rect x="28" y="82" width="544" height="130" rx="14" fill="white" stroke="#bfd1d2" stroke-width="2"/><text x="48" y="120" font-family="SimHei" font-size="25" fill="#176f72" text-anchor="start">两次全域遍历</text><text x="48" y="155" font-family="SimHei" font-size="22" fill="#233c49" text-anchor="start">seed：写完所有元素</text><text x="48" y="187" font-family="SimHei" font-size="22" fill="#233c49" text-anchor="start">scale：再读写所有元素</text><path d="M300,218 L300.0,240.0" stroke="#176f72" stroke-width="3" fill="none"/><polygon points="300,251 295.0,240.0 305.0,240.0" fill="#176f72"/><rect x="28" y="265" width="544" height="130" rx="14" fill="white" stroke="#bfd1d2" stroke-width="2"/><text x="48" y="303" font-family="SimHei" font-size="25" fill="#176f72" text-anchor="start">满足条件后：每项连续两步</text><text x="48" y="338" font-family="SimHei" font-size="22" fill="#233c49" text-anchor="start">实例 i：seed(i) → scale(i)</text><text x="48" y="370" font-family="SimHei" font-size="22" fill="#233c49" text-anchor="start">保留原结果，减少中间数据往返</text><rect x="28" y="435" width="544" height="130" rx="14" fill="white" stroke="#bfd1d2" stroke-width="2"/><text x="48" y="473" font-family="SimHei" font-size="25" fill="#176f72" text-anchor="start">若 scale(i) 还读相邻元素</text><text x="48" y="508" font-family="SimHei" font-size="22" fill="#233c49" text-anchor="start">需要其他实例结果，不能这样融合</text><text x="28" y="605" font-family="SimHei" font-size="17" fill="#5c7078" text-anchor="start">原理示意 · 对应 Blink CL13553 实现</text></svg>