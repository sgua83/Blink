<text x="40" y="216" font-size="33" fill="#263746">C++ 串行</text>
<text x="405" y="216" font-size="34" fill="#263746">12.348 ms / 轮</text>
<rect x="40" y="240" width="536.7417964024919" height="17" rx="3" fill="#7e8c97" stroke="#7e8c97"/>
<text x="40" y="290" font-size="29" fill="#7e8c97">比较基准</text>
<rect x="20" y="328" width="720" height="136" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="40" y="367" font-size="33" fill="#263746">B CPU 并行</text>
<text x="405" y="367" font-size="34" fill="#263746">14.033 ms / 轮</text>
<rect x="40" y="391" width="610.0" height="17" rx="3" fill="#339ba2" stroke="#339ba2"/>
