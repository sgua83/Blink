<svg xmlns="http://www.w3.org/2000/svg" width="600" height="512" viewBox="0 0 600 512" font-family="SimHei"><text x="26" y="43" font-size="30" fill="#147d86">冲突发生在读、改、写之间</text><rect x="20" y="76" width="560" height="192" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="113" font-size="28" fill="#147d86">争写同一个 total，初值为 0</text><text x="40" y="157" font-size="27" fill="#253e53">A 读取 0；B 也读取 0</text><text x="40" y="196" font-size="27" fill="#253e53">A 加 3，写回 3</text><text x="40" y="235" font-size="27" fill="#253e53">B 加 1，写回 1：覆盖了 A</text><rect x="20" y="294" width="560" height="192" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="331" font-size="28" fill="#147d86">独占写入不同结果</text><text x="40" y="375" font-size="27" fill="#253e53">A 只写 output[0]</text><text x="40" y="414" font-size="27" fill="#253e53">B 只写 output[1]</text><text x="40" y="453" font-size="27" fill="#253e53">汇总使用 reduce，明确交给集合算法</text></svg>