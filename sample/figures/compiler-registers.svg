<svg xmlns="http://www.w3.org/2000/svg" width="600" height="690" viewBox="0 0 600 690"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176f72"/></marker></defs><rect width="600" height="690" rx="16" fill="#f4f7f7"/><text x="28" y="48" font-family="SimHei" font-size="28" fill="#176f72" text-anchor="start">先看值寿命，再分配寄存器</text><rect x="28" y="83" width="544" height="104" rx="14" fill="white" stroke="#bfd1d2" stroke-width="2"/><text x="48" y="121" font-family="SimHei" font-size="25" fill="#176f72" text-anchor="start">虚拟结果不是物理寄存器</text><text x="48" y="156" font-family="SimHei" font-size="22" fill="#233c49" text-anchor="start">r0、r1、r2 … 描述中间结果</text><text x="40" y="254" font-family="SimHei" font-size="26" fill="#233c49" text-anchor="start">a</text><path d="M90,246 L300,246" stroke="#176f72" stroke-width="18"/><text x="40" y="329" font-family="SimHei" font-size="26" fill="#233c49" text-anchor="start">b</text><path d="M200,321 L510,321" stroke="#b38a47" stroke-width="18"/><text x="40" y="404" font-family="SimHei" font-size="26" fill="#233c49" text-anchor="start">c</text><path d="M320,396 L510,396" stroke="#176f72" stroke-width="18"/><rect x="28" y="510" width="544" height="120" rx="14" fill="white" stroke="#bfd1d2" stroke-width="2"/><text x="48" y="548" font-family="SimHei" font-size="25" fill="#176f72" text-anchor="start">同时活跃的值不能互相覆盖</text><text x="48" y="583" font-family="SimHei" font-size="22" fill="#233c49" text-anchor="start">寿命不冲突时，可复用同一位置</text><text x="28" y="670" font-family="SimHei" font-size="17" fill="#5c7078" text-anchor="start">原理示意 · 对应 Blink CL13062 实现</text></svg>