<svg xmlns="http://www.w3.org/2000/svg" width="600" height="613" viewBox="0 0 600 613" font-family="SimHei"><text x="26" y="43" font-size="30" fill="#147d86">粒子之间独立，粒子内部有序</text><rect x="20" y="76" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="113" font-size="28" fill="#147d86">串行：处理完一个，再处理下一个</text><text x="40" y="157" font-size="27" fill="#253e53">粒子 0：加速度 → 新速度 → 新位置</text><text x="40" y="196" font-size="27" fill="#253e53">粒子 1：加速度 → 新速度 → 新位置</text><rect x="20" y="255" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="292" font-size="28" fill="#147d86">并行：每列是一份独占粒子</text><text x="40" y="336" font-size="27" fill="#253e53">粒子 0、1、2…可以各自推进</text><text x="40" y="375" font-size="27" fill="#253e53">每列内部仍先算速度，再算位置</text><rect x="20" y="434" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="471" font-size="28" fill="#147d86">可融合与必须汇总的位置</text><text x="40" y="515" font-size="27" fill="#253e53">同一粒子的积分 → 能量：可融合</text><text x="40" y="554" font-size="27" fill="#253e53">所有粒子能量 → 总能量：归约</text></svg>