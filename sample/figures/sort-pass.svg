<svg xmlns="http://www.w3.org/2000/svg" width="600" height="652" viewBox="0 0 600 652" font-family="SimHei"><text x="26" y="43" font-size="30" fill="#147d86">稳定排序的一轮：统计与定位</text><rect x="20" y="76" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="113" font-size="28" fill="#147d86">先看只有 0、1、2 的键</text><text x="40" y="157" font-size="27" fill="#253e53">输入键：[2, 1, 0, 2]</text><text x="40" y="196" font-size="27" fill="#253e53">桶计数：[1, 1, 2]</text><rect x="20" y="255" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="292" font-size="28" fill="#147d86">扫描桶计数，得到桶起点</text><text x="40" y="336" font-size="27" fill="#253e53">桶 0 起点：0；桶 1 起点：1</text><text x="40" y="375" font-size="27" fill="#253e53">桶 2 起点：2</text><rect x="20" y="434" width="560" height="192" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="471" font-size="28" fill="#147d86">桶起点 + 桶内稳定序号</text><text x="40" y="515" font-size="27" fill="#253e53">两个键 2 依次占位置 2、3</text><text x="40" y="554" font-size="27" fill="#253e53">排序键：[0, 1, 2, 2]</text><text x="40" y="593" font-size="27" fill="#253e53">真实 32 位键逐轮处理低位到高位</text></svg>