<svg xmlns="http://www.w3.org/2000/svg" width="600" height="581"><rect width="600" height="581" rx="12" fill="#f5f9fa"/><text x="24" y="46" font-family="SimHei" font-size="30" fill="#147d86">一个总和，怎样从小计合并</text><rect x="24" y="78" width="552" height="137" rx="12" fill="white" stroke="#c6d9dc"/><text x="42" y="114" font-family="SimHei" font-size="25" fill="#147d86">顺序：累计值交给下一步</text><text x="42" y="152" font-family="SimHei" font-size="26" fill="#263746">0 + 1 = 1     1 + 2 = 3</text><text x="42" y="188" font-family="SimHei" font-size="26" fill="#263746">3 + 3 = 6     6 + 4 = 10</text><rect x="24" y="235" width="552" height="137" rx="12" fill="white" stroke="#c6d9dc"/><text x="42" y="271" font-family="SimHei" font-size="25" fill="#147d86">并行归约：独立小计，再合并</text><text x="42" y="309" font-family="SimHei" font-size="26" fill="#263746">1 + 2 = 3     3 + 4 = 7</text><text x="42" y="345" font-family="SimHei" font-size="26" fill="#263746">          3 + 7 = 10</text><rect x="24" y="392" width="552" height="137" rx="12" fill="white" stroke="#c6d9dc"/><text x="42" y="428" font-family="SimHei" font-size="25" fill="#147d86">独占前缀和：不包括当前位置</text><text x="42" y="466" font-family="SimHei" font-size="26" fill="#263746">输入：1、2、3、4</text><text x="42" y="502" font-family="SimHei" font-size="26" fill="#263746">前缀：0、1、3、6</text><text x="24" y="563" font-family="SimHei" font-size="18" fill="#637881">展示数学依赖 · 具体分组由执行实现决定</text></svg>
