<svg xmlns="http://www.w3.org/2000/svg" width="560" height="544" viewBox="0 0 560 544">
<rect x="0" y="0" width="560" height="544" rx="0" fill="#f7fafb" stroke="#f7fafb"/>
<text x="22" y="42" fill="#147d86" font-size="31">两个生产者，汇成一个结果</text>
<rect x="20" y="90" width="520" height="102" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="126" fill="#147d86" font-size="27">left / 第一组粒子</text>
<text x="38" y="167" fill="#263746" font-size="25">step_and_total → left.total</text>
<line x1="280" y1="196" x2="280" y2="211" stroke="#147d86" stroke-width="2"/>
<rect x="20" y="216" width="520" height="102" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="252" fill="#147d86" font-size="27">right / 第二组粒子</text>
<text x="38" y="293" fill="#263746" font-size="25">step_and_total → right.total</text>
<line x1="280" y1="322" x2="280" y2="337" stroke="#147d86" stroke-width="2"/>
<rect x="20" y="342" width="520" height="138" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="378" fill="#147d86" font-size="27">finish / 真正需要两个结果</text>
<text x="38" y="419" fill="#263746" font-size="25">left.total + right.total</text>
<text x="38" y="455" fill="#263746" font-size="25">→ combined.value</text>
<text x="22" y="520" fill="#657787" font-size="20">同队列逻辑分支 · 不承诺硬件同时执行</text>
</svg>
