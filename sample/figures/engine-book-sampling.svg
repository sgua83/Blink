<svg xmlns="http://www.w3.org/2000/svg" width="680" height="790" viewBox="0 0 680 790"><rect x="1" y="1" width="678" height="788" rx="18" fill="#fbfdfe" stroke="#cadde3"/><text x="30" y="57" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="36" fill="#147d86">两种采样，共同估计一份光</text><rect x="30" y="100" width="620" height="155" rx="12" fill="#eef5f7" stroke="#cadde3"/><text x="50" y="145" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="32" fill="#147d86">光源采样</text><text x="50" y="195" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="29" fill="#263746">先选灯上的点，再连接表面</text><rect x="30" y="310" width="620" height="155" rx="12" fill="#eef5f7" stroke="#cadde3"/><text x="50" y="355" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="32" fill="#147d86">材质采样</text><text x="50" y="405" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="29" fill="#263746">先选散射方向，再寻找下一事件</text><line x1="635" y1="255" x2="635" y2="505" stroke="#147d86" stroke-width="3"/><line x1="635" y1="505" x2="540" y2="535" stroke="#147d86" stroke-width="4"/><polygon points="540.00,535.00 551.22,525.04 554.90,536.71" fill="#147d86" stroke="#147d86" stroke-width="3"/><line x1="340" y1="470" x2="340" y2="525" stroke="#147d86" stroke-width="4"/><polygon points="340.00,525.00 333.88,511.30 346.12,511.30" fill="#147d86" stroke="#147d86" stroke-width="3"/><rect x="30" y="540" width="620" height="165" rx="12" fill="#eef5f7" stroke="#cadde3"/><text x="50" y="582" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="32" fill="#147d86">MIS 按概率密度分配权重</text><text x="50" y="625" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="28" fill="#263746">pA = 2，pB = 1</text><text x="50" y="668" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="28" fill="#263746">wA = .8，wB = .2</text><text x="40" y="755" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="28" fill="#263746">理想镜面事件使用独立的离散概率</text></svg>