<svg xmlns="http://www.w3.org/2000/svg" width="600" height="609" viewBox="0 0 600 609" font-family="SimHei"><text x="20" y="40" font-size="30" fill="#147d86">同一个公式，不同的活动路径</text><rect x="20" y="78" width="560" height="152" rx="12" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="115" font-size="28" fill="#147d86">逐点输入不同</text><text x="40" y="160" font-size="27" fill="#253e53">点 0：nl=0；点 1：nl=0.3</text><text x="40" y="202" font-size="27" fill="#253e53">点 2：nl=0；点 3：nl=0.8</text><rect x="20" y="255" width="560" height="152" rx="12" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="292" font-size="28" fill="#147d86">函数按当前元素决定路径</text><text x="40" y="337" font-size="27" fill="#253e53">点 0、2：返回零贡献</text><text x="40" y="379" font-size="27" fill="#253e53">点 1、3：继续完成光照公式</text><rect x="20" y="432" width="560" height="152" rx="12" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="469" font-size="28" fill="#147d86">局部结果仍然独占</text><text x="40" y="514" font-size="27" fill="#253e53">每个点只写自己的 radiance</text><text x="40" y="556" font-size="27" fill="#253e53">分支分歧可能影响 GPU 利用率</text></svg>