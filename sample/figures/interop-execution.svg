<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1160">
<rect x="0" y="0" width="760" height="1160" rx="12" fill="#f5f8fa" stroke="#f5f8fa" />
<text x="28" y="58" font-size="42" fill="#147d86">看见一次完整调用的底层过程</text>
<rect x="20" y="105" width="720" height="180" rx="12" fill="#ffffff" stroke="#d9e4eb" />
<text x="40" y="149" font-size="34" fill="#147d86">串行 / 宿主循环</text>
<text x="40" y="203" font-size="30" fill="#263746">宿主数组 → 逐个像素 → 宿主数组</text>
<text x="40" y="253" font-size="27" fill="#657787">当前像素的 while 完成后，继续下一个。</text>
<rect x="20" y="320" width="720" height="330" rx="12" fill="#ffffff" stroke="#d9e4eb" />
<text x="40" y="365" font-size="34" fill="#147d86">CPU DLL / 多核范围执行</text>
<text x="40" y="417" font-size="30" fill="#263746">宿主数组 → 本次 Dataset 存储</text>
<line x1="380" y1="430" x2="380" y2="463" stroke="#147d86" stroke-width="3" />
<line x1="372" y1="451" x2="380" y2="463" stroke="#147d86" stroke-width="3" />
<line x1="388" y1="451" x2="380" y2="463" stroke="#147d86" stroke-width="3" />
<rect x="40" y="475" width="200" height="65" rx="12" fill="#eef4f7" stroke="#d9e4eb" />
<text x="60" y="519" font-size="30" fill="#263746">范围 0</text>
<rect x="280" y="475" width="200" height="65" rx="12" fill="#eef4f7" stroke="#d9e4eb" />
<text x="300" y="519" font-size="30" fill="#263746">范围 1</text>
<rect x="520" y="475" width="200" height="65" rx="12" fill="#eef4f7" stroke="#d9e4eb" />
<text x="540" y="519" font-size="30" fill="#263746">范围 2…</text>
<line x1="380" y1="548" x2="380" y2="579" stroke="#147d86" stroke-width="3" />
<line x1="372" y1="567" x2="380" y2="579" stroke="#147d86" stroke-width="3" />
<line x1="388" y1="567" x2="380" y2="579" stroke="#147d86" stroke-width="3" />
<text x="40" y="622" font-size="30" fill="#263746">范围完成 → 输出复制 → run 返回</text>
<rect x="20" y="687" width="720" height="400" rx="12" fill="#ffffff" stroke="#d9e4eb" />
<text x="40" y="732" font-size="34" fill="#147d86">GPU DLL / 设备执行与读回</text>
<text x="40" y="786" font-size="30" fill="#263746">本次 Dataset → 上传设备存储</text>
<line x1="380" y1="800" x2="380" y2="830" stroke="#147d86" stroke-width="3" />
<line x1="372" y1="818" x2="380" y2="830" stroke="#147d86" stroke-width="3" />
<line x1="388" y1="818" x2="380" y2="830" stroke="#147d86" stroke-width="3" />
<rect x="40" y="841" width="680" height="65" rx="12" fill="#eef4f7" stroke="#d9e4eb" />
<text x="60" y="885" font-size="30" fill="#263746">提交 → 大量像素在 GPU 上推进</text>
<line x1="380" y1="914" x2="380" y2="947" stroke="#147d86" stroke-width="3" />
<line x1="372" y1="935" x2="380" y2="947" stroke="#147d86" stroke-width="3" />
<line x1="388" y1="935" x2="380" y2="947" stroke="#147d86" stroke-width="3" />
<text x="40" y="991" font-size="30" fill="#263746">等待真实完成 → 下载输出</text>
<text x="40" y="1046" font-size="30" fill="#263746">输出复制到宿主数组 → run 返回</text>
<text x="28" y="1134" font-size="27" fill="#657787">Program 复用代码；数组仍归宿主所有。</text>
</svg>