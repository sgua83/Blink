<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720"><rect x="1" y="1" width="678" height="718" rx="18" fill="#fbfdfe" stroke="#cadde3"/><text x="30" y="57" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="36" fill="#147d86">三角形：重心与表面属性</text><polygon points="120.00,400.00 570.00,400.00 260.00,140.00" fill="#eef5f7" stroke="#147d86" stroke-width="3"/><circle cx="267.5" cy="335" r="8" fill="#b77835" stroke="#b77835"/><line x1="120" y1="400" x2="267.5" y2="335" stroke="#cadde3" stroke-width="2"/><line x1="570" y1="400" x2="267.5" y2="335" stroke="#cadde3" stroke-width="2"/><line x1="260" y1="140" x2="267.5" y2="335" stroke="#cadde3" stroke-width="2"/><text x="55" y="444" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="27" fill="#263746">a : 权重 .5</text><text x="419" y="444" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="27" fill="#263746">b : .25</text><text x="215" y="115" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="27" fill="#263746">c : .25</text><text x="285" y="320" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="29" fill="#b77835">命中 p</text><rect x="30" y="475" width="620" height="130" rx="12" fill="#eef5f7" stroke="#cadde3"/><text x="50" y="517" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="32" fill="#147d86">p = .5a + .25b + .25c</text><text x="50" y="560" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="28" fill="#263746">法线与 UV 用同一组权重插值</text><text x="40" y="658" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="29" fill="#263746">几何边 → 几何法线</text><text x="40" y="702" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="29" fill="#263746">顶点属性 → 着色法线</text></svg>