<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176f72"/></marker></defs><rect width="600" height="650" rx="16" fill="#f4f7f7"/><text x="28" y="48" font-family="SimHei" font-size="28" fill="#176f72" text-anchor="start">资源跟随最后一个真实消费者</text><rect x="28" y="82" width="544" height="127" rx="14" fill="white" stroke="#bfd1d2" stroke-width="2"/><text x="48" y="120" font-family="SimHei" font-size="25" fill="#176f72" text-anchor="start">CPU 提交后</text><text x="48" y="155" font-family="SimHei" font-size="22" fill="#233c49" text-anchor="start">数据继续拥有最后使用点</text><path d="M300,215 L300.0,233.0" stroke="#176f72" stroke-width="3" fill="none"/><polygon points="300,244 295.0,233.0 305.0,233.0" fill="#176f72"/><rect x="28" y="258" width="544" height="127" rx="14" fill="white" stroke="#bfd1d2" stroke-width="2"/><text x="48" y="296" font-family="SimHei" font-size="25" fill="#176f72" text-anchor="start">GPU 正在消费</text><text x="48" y="331" font-family="SimHei" font-size="22" fill="#233c49" text-anchor="start">退出 CPU 作用域，不等于设备结束</text><path d="M300,391 L300.0,409.0" stroke="#176f72" stroke-width="3" fill="none"/><polygon points="300,420 295.0,409.0 305.0,409.0" fill="#176f72"/><rect x="28" y="434" width="544" height="127" rx="14" fill="white" stroke="#bfd1d2" stroke-width="2"/><text x="48" y="472" font-family="SimHei" font-size="25" fill="#176f72" text-anchor="start">真实完成后</text><text x="48" y="507" font-family="SimHei" font-size="22" fill="#233c49" text-anchor="start">释放命令资源与不再使用的存储</text><text x="28" y="630" font-family="SimHei" font-size="17" fill="#5c7078" text-anchor="start">原理示意 · 对应 Blink CL13553 实现</text></svg>