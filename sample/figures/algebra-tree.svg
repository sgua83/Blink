<svg xmlns="http://www.w3.org/2000/svg" width="600" height="613" viewBox="0 0 600 613" font-family="SimHei"><text x="26" y="43" font-size="30" fill="#147d86">组合步骤，而非同时修改 x</text><rect x="20" y="76" width="560" height="114" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="113" font-size="28" fill="#147d86">直接串行作用于 x=3</text><text x="40" y="157" font-size="27" fill="#253e53">3 → 7 → 15 → 31 → 63</text><rect x="20" y="216" width="560" height="192" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="253" font-size="28" fill="#147d86">先并行组合变换摘要</text><text x="40" y="297" font-size="27" fill="#253e53">每一步：(2, 1)</text><text x="40" y="336" font-size="27" fill="#253e53">两对摘要：(4, 3)、(4, 3)</text><text x="40" y="375" font-size="27" fill="#253e53">合并总摘要：(16, 15)</text><rect x="20" y="434" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="471" font-size="28" fill="#147d86">最后作用于初值</text><text x="40" y="515" font-size="27" fill="#253e53">16 × 3 + 15 = 63</text><text x="40" y="554" font-size="27" fill="#253e53">保持左右顺序，只改变结合括号</text></svg>