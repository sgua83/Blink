<svg xmlns="http://www.w3.org/2000/svg" width="560" height="508">
<rect x="0" y="0" width="560" height="508" rx="0" fill="#f7fafb" stroke="#f7fafb"/>
<text x="22" y="42" fill="#147d86" font-size="31">Rust 和 B 怎样配合</text>
<rect x="20" y="90" width="520" height="102" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="126" fill="#147d86" font-size="27">Rust / 创建输入</text>
<text x="38" y="167" fill="#263746" font-size="25">values = [1,2,3,4]</text>
<line x1="280" y1="196" x2="280" y2="211" stroke="#147d86" stroke-width="2"/>
<rect x="20" y="216" width="520" height="102" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="252" fill="#147d86" font-size="27">B / 对每个数计算</text>
<text x="38" y="293" fill="#263746" font-size="25">value = value * 2 + 1</text>
<line x1="280" y1="322" x2="280" y2="337" stroke="#147d86" stroke-width="2"/>
<rect x="20" y="342" width="520" height="102" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="378" fill="#147d86" font-size="27">Rust / 打印结果</text>
<text x="38" y="419" fill="#263746" font-size="25">values = [3,5,7,9]</text>
<text x="22" y="484" fill="#657787" font-size="20">执行顺序示意 · 连线不表示耗时</text>
</svg>
