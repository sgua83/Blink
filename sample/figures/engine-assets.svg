<svg xmlns="http://www.w3.org/2000/svg" width="560" height="616">
<rect x="0" y="0" width="560" height="616" rx="0" fill="#f7fafb" stroke="#f7fafb"/>
<text x="22" y="42" fill="#147d86" font-size="31">资产与运行资源各有边界</text>
<rect x="20" y="90" width="520" height="138" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="126" fill="#147d86" font-size="27">源 / 离线转换</text>
<text x="38" y="167" fill="#263746" font-size="25">OBJ → cook → BLGEOM</text>
<text x="38" y="203" fill="#263746" font-size="25">场景文本 → cook-scene → BLSCENE</text>
<line x1="280" y1="232" x2="280" y2="247" stroke="#147d86" stroke-width="2"/>
<rect x="20" y="252" width="520" height="138" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="288" fill="#147d86" font-size="27">运行 / 内容与关系</text>
<text x="38" y="329" fill="#263746" font-size="25">几何、材质、纹理和节点</text>
<text x="38" y="365" fill="#263746" font-size="25">没有保存设备句柄</text>
<line x1="280" y1="394" x2="280" y2="409" stroke="#147d86" stroke-width="2"/>
<rect x="20" y="414" width="520" height="138" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="450" fill="#147d86" font-size="27">消费 / 实际平台对象</text>
<text x="38" y="491" fill="#263746" font-size="25">BLAS、TLAS、dataset、texture</text>
<text x="38" y="527" fill="#263746" font-size="25">由运行时所有者创建与释放</text>
<text x="22" y="592" fill="#657787" font-size="20">固定源码关系示意 · 连线不表示耗时</text>
