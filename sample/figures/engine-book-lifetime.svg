<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850"><rect x="1" y="1" width="678" height="848" rx="18" fill="#fbfdfe" stroke="#cadde3"/><text x="30" y="57" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="36" fill="#147d86">资源寿命跟随最后一次使用</text><rect x="30" y="95" width="620" height="135" rx="12" fill="#eef5f7" stroke="#cadde3"/><text x="50" y="137" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="32" fill="#147d86">读取与构建输入</text><text x="50" y="180" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="28" fill="#263746">CPU 网格 → 上传 → BLAS 构建</text><line x1="340" y1="235" x2="340" y2="273" stroke="#147d86" stroke-width="4"/><polygon points="340.00,273.00 333.88,259.30 346.12,259.30" fill="#147d86" stroke="#147d86" stroke-width="3"/><rect x="30" y="285" width="620" height="135" rx="12" fill="#eef5f7" stroke="#cadde3"/><text x="50" y="327" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="32" fill="#147d86">构建完成</text><text x="50" y="370" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="28" fill="#263746">输入可释放；BLAS 继续存在</text><line x1="340" y1="425" x2="340" y2="463" stroke="#147d86" stroke-width="4"/><polygon points="340.00,463.00 333.88,449.30 346.12,449.30" fill="#147d86" stroke="#147d86" stroke-width="3"/><rect x="30" y="475" width="620" height="135" rx="12" fill="#eef5f7" stroke="#cadde3"/><text x="50" y="517" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="32" fill="#147d86">绘制使用</text><text x="50" y="560" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="28" fill="#263746">TLAS、属性、图像仍要保留</text><line x1="340" y1="615" x2="340" y2="653" stroke="#147d86" stroke-width="4"/><polygon points="340.00,653.00 333.88,639.30 346.12,639.30" fill="#147d86" stroke="#147d86" stroke-width="3"/><rect x="30" y="665" width="620" height="135" rx="12" fill="#eef5f7" stroke="#cadde3"/><text x="50" y="707" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="32" fill="#147d86">绘制真正完成</text><text x="50" y="750" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="28" fill="#263746">无后续消费者的资源才可释放</text></svg>