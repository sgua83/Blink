<svg xmlns="http://www.w3.org/2000/svg" width="600" height="652" viewBox="0 0 600 652" font-family="SimHei"><text x="26" y="43" font-size="30" fill="#147d86">块内协作：一块一个小世界</text><rect x="20" y="76" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="113" font-size="28" fill="#147d86">入口快照，只读版本</text><text x="40" y="157" font-size="27" fill="#253e53">块 A：[1, 2, 3, 4]，长度 4</text><text x="40" y="196" font-size="27" fill="#253e53">块 B：[5, 6]，长度 2</text><rect x="20" y="255" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="292" font-size="28" fill="#147d86">同块汇总；两块独立</text><text x="40" y="336" font-size="27" fill="#253e53">块 A：total=10，mean=2.5</text><text x="40" y="375" font-size="27" fill="#253e53">块 B：total=11，mean=5.5</text><rect x="20" y="434" width="560" height="192" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="471" font-size="28" fill="#147d86">每个元素写自己的结果</text><text x="40" y="515" font-size="27" fill="#253e53">块 A：[-1.5, -0.5, 0.5, 1.5]</text><text x="40" y="554" font-size="27" fill="#253e53">块 B：[-0.5, 0.5]</text><text x="40" y="593" font-size="27" fill="#253e53">块 A 不必等待块 B 的 total</text></svg>