<svg xmlns="http://www.w3.org/2000/svg" width="600" height="691" viewBox="0 0 600 691" font-family="SimHei"><text x="26" y="43" font-size="30" fill="#147d86">逻辑元素怎样落到硬件</text><rect x="20" y="76" width="560" height="192" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="113" font-size="28" fill="#147d86">CPU：连续范围交给工作线程</text><text x="40" y="157" font-size="27" fill="#253e53">范围 A：[0, 4) → 一个工作线程</text><text x="40" y="196" font-size="27" fill="#253e53">范围 B：[4, 8) → 另一个工作线程</text><text x="40" y="235" font-size="27" fill="#253e53">每个范围内执行原生 x64 代码</text><rect x="20" y="294" width="560" height="192" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="331" font-size="28" fill="#147d86">GPU：调用实例组成工作组</text><text x="40" y="375" font-size="27" fill="#253e53">实例 i → 负责第 i 个元素</text><text x="40" y="414" font-size="27" fill="#253e53">多个实例 → 一个 workgroup</text><text x="40" y="453" font-size="27" fill="#253e53">多个工作组覆盖完整元素域</text><rect x="20" y="512" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="549" font-size="28" fill="#147d86">执行粒度与数据条数不同</text><text x="40" y="593" font-size="27" fill="#253e53">一个元素不等于一个系统线程</text><text x="40" y="632" font-size="27" fill="#253e53">分组数量由实际执行资源决定</text></svg>