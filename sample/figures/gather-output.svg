<svg xmlns="http://www.w3.org/2000/svg" width="600" height="652" viewBox="0 0 600 652" font-family="SimHei"><text x="26" y="43" font-size="30" fill="#147d86">共享材料，独占成品</text><rect x="20" y="76" width="560" height="192" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="113" font-size="28" fill="#147d86">输入：只读的四个采样</text><text x="40" y="157" font-size="27" fill="#253e53">a　b</text><text x="40" y="196" font-size="27" fill="#253e53">c　d</text><text x="40" y="235" font-size="27" fill="#253e53">一个输出读取 a、b、c、d</text><rect x="20" y="294" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="331" font-size="28" fill="#147d86">每个输出自己收集材料</text><text x="40" y="375" font-size="27" fill="#253e53">读取 → 平均 → 色调映射 → 打包</text><text x="40" y="414" font-size="27" fill="#253e53">只写自己的 display[i]</text><rect x="20" y="473" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="510" font-size="28" fill="#147d86">多个输出可独立推进</text><text x="40" y="554" font-size="27" fill="#253e53">共享只读不会互相覆盖</text><text x="40" y="593" font-size="27" fill="#253e53">若都去累加同一输出，就需要协调</text></svg>