<svg xmlns="http://www.w3.org/2000/svg" width="600" height="474" viewBox="0 0 600 474" font-family="SimHei"><text x="20" y="40" font-size="30" fill="#147d86">原子修改的范围是一处位置</text><rect x="20" y="78" width="560" height="194" rx="12" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="115" font-size="28" fill="#147d86">同一计数的修改按某个顺序完成</text><text x="40" y="160" font-size="27" fill="#253e53">初值 0：A 加 3 → 3；B 加 1 → 4</text><text x="40" y="202" font-size="27" fill="#253e53">也可能：B 加 1 → 1；A 加 3 → 4</text><text x="40" y="244" font-size="27" fill="#253e53">不会有普通读改写的覆盖丢失</text><rect x="20" y="297" width="560" height="152" rx="12" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="334" font-size="28" fill="#147d86">relaxed 没有发布其他数据</text><text x="40" y="379" font-size="27" fill="#253e53">计数已更新 ≠ 其他载荷已可见</text><text x="40" y="421" font-size="27" fill="#253e53">不同地址之间仍需真实同步关系</text></svg>