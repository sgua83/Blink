<svg xmlns="http://www.w3.org/2000/svg" width="600" height="613" viewBox="0 0 600 613" font-family="SimHei"><text x="26" y="43" font-size="30" fill="#147d86">先生产，再交给同块读取</text><rect x="20" y="76" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="113" font-size="28" fill="#147d86">第一阶段：每个 lane 生产值</text><text x="40" y="157" font-size="27" fill="#253e53">旧值：[1, 2, 3, 4]</text><text x="40" y="196" font-size="27" fill="#253e53">各自乘二：[2, 4, 6, 8]</text><rect x="20" y="255" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="292" font-size="28" fill="#147d86">块内发布与同步</text><text x="40" y="336" font-size="27" fill="#253e53">各自写入对应共享位置</text><text x="40" y="375" font-size="27" fill="#253e53">全块到达发布点后才读取新版本</text><rect x="20" y="434" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="471" font-size="28" fill="#147d86">第二阶段：归约并各自写回</text><text x="40" y="515" font-size="27" fill="#253e53">块内总量：20；均值：5</text><text x="40" y="554" font-size="27" fill="#253e53">centered：[-3, -1, 1, 3]</text></svg>