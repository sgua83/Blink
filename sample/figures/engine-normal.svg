<svg xmlns="http://www.w3.org/2000/svg" width="560" height="580">
<rect x="0" y="0" width="560" height="580" rx="0" fill="#f7fafb" stroke="#f7fafb"/>
<text x="22" y="42" fill="#147d86" font-size="31">沿 x 放大两倍之后</text>
<rect x="20" y="90" width="520" height="138" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="126" fill="#147d86" font-size="27">原表面 / 仍然垂直</text>
<text x="38" y="167" fill="#263746" font-size="25">t=(1,-1,0)  n=(1,1,0)</text>
<text x="38" y="203" fill="#263746" font-size="25">dot(t,n)=0</text>
<line x1="280" y1="232" x2="280" y2="247" stroke="#147d86" stroke-width="2"/>
<rect x="20" y="252" width="520" height="102" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="288" fill="#147d86" font-size="27">切向 / A*t</text>
<text x="38" y="329" fill="#263746" font-size="25">t_new=(2,-1,0)</text>
<line x1="280" y1="358" x2="280" y2="373" stroke="#147d86" stroke-width="2"/>
<rect x="20" y="378" width="520" height="138" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="414" fill="#147d86" font-size="27">法线 / transpose(inverse(A))*n</text>
<text x="38" y="455" fill="#263746" font-size="25">n_new=(.5,1,0)</text>
<text x="38" y="491" fill="#263746" font-size="25">dot(t_new,n_new)=0</text>
<text x="22" y="556" fill="#657787" font-size="20">省略归一化 · 用方向关系展示逆转置</text>
</svg>
