<svg xmlns="http://www.w3.org/2000/svg" width="600" height="652" viewBox="0 0 600 652" font-family="SimHei"><text x="26" y="43" font-size="30" fill="#147d86">稳定筛选：位置先算好</text><rect x="20" y="76" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="113" font-size="28" fill="#147d86">原始输入与保留标记</text><text x="40" y="157" font-size="27" fill="#253e53">id：0　1　2　3　4　5　6　7</text><text x="40" y="196" font-size="27" fill="#253e53">标记：1　0　1　0　1　0　1　0</text><rect x="20" y="255" width="560" height="153" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="292" font-size="28" fill="#147d86">标记做独占前缀和</text><text x="40" y="336" font-size="27" fill="#253e53">前缀：0　1　1　2　2　3　3　4</text><text x="40" y="375" font-size="27" fill="#253e53">仅保留项使用自己的前缀位置</text><rect x="20" y="434" width="560" height="192" rx="14" fill="#eef4f7" stroke="#d9e4eb"/><text x="40" y="471" font-size="28" fill="#147d86">不同项写入不同目的位置</text><text x="40" y="515" font-size="27" fill="#253e53">id 0 → 位置 0；id 2 → 位置 1</text><text x="40" y="554" font-size="27" fill="#253e53">id 4 → 位置 2；id 6 → 位置 3</text><text x="40" y="593" font-size="27" fill="#253e53">结果：[0, 2, 4, 6]；count=4</text></svg>