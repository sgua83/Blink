<svg xmlns="http://www.w3.org/2000/svg" width="680" height="628"><rect x="0" y="0" width="680" height="628" rx="12" fill="#f7fafb" stroke="#d9e4eb"/><text x="26" y="48" font-size="34" fill="#147d86">从文件到结果</text><rect x="26" y="82" width="628" height="107" rx="10" fill="#ffffff" stroke="#d9e4eb"/><text x="44" y="115" font-size="28" fill="#147d86">.h / 清单</text><text x="44" y="157" font-size="32" fill="#263746">程序叫什么？接收和填写哪些数据？</text><rect x="26" y="209" width="628" height="107" rx="10" fill="#ffffff" stroke="#d9e4eb"/><text x="44" y="242" font-size="28" fill="#147d86">.b / 做法</text><text x="44" y="284" font-size="32" fill="#263746">给出具体计算：number = 1 + 2;</text><rect x="26" y="336" width="628" height="107" rx="10" fill="#ffffff" stroke="#d9e4eb"/><text x="44" y="369" font-size="28" fill="#147d86">blrun / 编译并运行</text><text x="44" y="411" font-size="32" fill="#263746">读取源码 → 编译 → 执行</text><rect x="26" y="463" width="628" height="107" rx="10" fill="#ffffff" stroke="#d9e4eb"/><text x="44" y="496" font-size="28" fill="#147d86">.bldata / 结果文件</text><text x="44" y="538" font-size="32" fill="#263746">按声明的数据类型，保存实际数字</text><text x="26" y="602" font-size="17" fill="#657787">B 语言编程 · 2026-10-26</text></svg>
