<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700"><rect x="1" y="1" width="678" height="698" rx="18" fill="#fbfdfe" stroke="#cadde3"/><text x="30" y="57" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="36" fill="#147d86">先平均线性光，再映射显示</text><rect x="80" y="110" width="130" height="130" rx="12" fill="#eef5f7" stroke="#cadde3"/><text x="130" y="188" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="42" fill="#147d86">1</text><rect x="220" y="110" width="130" height="130" rx="12" fill="#eef5f7" stroke="#cadde3"/><text x="270" y="188" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="42" fill="#147d86">2</text><rect x="80" y="250" width="130" height="130" rx="12" fill="#eef5f7" stroke="#cadde3"/><text x="130" y="328" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="42" fill="#147d86">3</text><rect x="220" y="250" width="130" height="130" rx="12" fill="#eef5f7" stroke="#cadde3"/><text x="270" y="328" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="42" fill="#147d86">4</text><line x1="360" y1="250" x2="450" y2="350" stroke="#147d86" stroke-width="4"/><polygon points="450.00,350.00 436.29,343.91 445.38,335.73" fill="#147d86" stroke="#147d86" stroke-width="3"/><rect x="460" y="300" width="155" height="110" rx="12" fill="#dcebef" stroke="#147d86"/><text x="494" y="368" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="42" fill="#147d86">2.5</text><text x="40" y="450" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="29" fill="#263746">一个显示像素 = 二乘二内部样本</text><rect x="30" y="495" width="620" height="145" rx="12" fill="#eef5f7" stroke="#cadde3"/><text x="50" y="537" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="32" fill="#147d86">平均 → 色调映射 → gamma</text><text x="50" y="580" font-family="Microsoft YaHei,SimHei,sans-serif" font-size="28" fill="#263746">再编码为八位显示像素</text></svg>