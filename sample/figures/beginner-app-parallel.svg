<svg xmlns="http://www.w3.org/2000/svg" width="600" height="666"><rect width="600" height="666" rx="12" fill="#f5f9fa"/><text x="24" y="46" font-family="SimHei" font-size="30" fill="#147d86">main 调用函数，完成应用</text><rect x="24" y="78" width="552" height="101" rx="12" fill="white" stroke="#c6d9dc"/><text x="42" y="114" font-family="SimHei" font-size="25" fill="#147d86">1 / main 创建数据</text><text x="42" y="152" font-family="SimHei" font-size="26" fill="#263746">numbers = dataset&lt;u32&gt;(4)</text><rect x="24" y="199" width="552" height="101" rx="12" fill="white" stroke="#c6d9dc"/><text x="42" y="235" font-family="SimHei" font-size="25" fill="#147d86">2 / main 发起计算</text><text x="42" y="273" font-family="SimHei" font-size="26" fill="#263746">target(cpu, run(numbers))</text><rect x="24" y="320" width="552" height="137" rx="12" fill="white" stroke="#c6d9dc"/><text x="42" y="356" font-family="SimHei" font-size="25" fill="#147d86">3 / parallel 处理每个位置</text><text x="42" y="394" font-family="SimHei" font-size="26" fill="#263746">value = index() + 1</text><text x="42" y="430" font-family="SimHei" font-size="26" fill="#263746">number = value * 2</text><rect x="24" y="477" width="552" height="137" rx="12" fill="white" stroke="#c6d9dc"/><text x="42" y="513" font-family="SimHei" font-size="25" fill="#147d86">4 / main 消费结果，再退出</text><text x="42" y="551" font-family="SimHei" font-size="26" fill="#263746">逐项显示：2、4、6、8</text><text x="42" y="587" font-family="SimHei" font-size="26" fill="#263746">离开作用域，释放 numbers</text><text x="24" y="648" font-family="SimHei" font-size="18" fill="#637881">B 语言编程 · 应用拥有数据 · 统一函数版</text></svg>
