<svg xmlns="http://www.w3.org/2000/svg" width="560" height="652">
<rect x="0" y="0" width="560" height="652" rx="0" fill="#f7fafb" stroke="#f7fafb"/>
<text x="22" y="42" fill="#147d86" font-size="31">连续三步怎样少传数据</text>
<rect x="20" y="90" width="520" height="174" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="126" fill="#147d86" font-size="27">每步都传输</text>
<text x="38" y="167" fill="#263746" font-size="25">上传 → 第一步 → 下载</text>
<text x="38" y="203" fill="#263746" font-size="25">上传 → 第二步 → 下载</text>
<text x="38" y="239" fill="#263746" font-size="25">上传 → 第三步 → 下载</text>
<rect x="20" y="288" width="520" height="138" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="324" fill="#147d86" font-size="27">数据留在设备上</text>
<text x="38" y="365" fill="#263746" font-size="25">上传 → 第一步 → 第二步</text>
<text x="38" y="401" fill="#263746" font-size="25">→ 第三步 → 最后下载</text>
<rect x="20" y="450" width="520" height="138" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="486" fill="#147d86" font-size="27">计算顺序相同</text>
<text x="38" y="527" fill="#263746" font-size="25">第二步使用第一步的新状态</text>
<text x="38" y="563" fill="#263746" font-size="25">只是减少了中间来回传输</text>
<text x="22" y="628" fill="#657787" font-size="20">执行顺序示意 · 连线不表示耗时</text>
</svg>
