<svg xmlns="http://www.w3.org/2000/svg" width="560" height="544">
<rect x="0" y="0" width="560" height="544" rx="0" fill="#f7fafb" stroke="#f7fafb"/>
<text x="22" y="42" fill="#147d86" font-size="31">一次粒子模拟的三步</text>
<rect x="20" y="90" width="520" height="102" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="126" fill="#147d86" font-size="27">integrate / 更新</text>
<text x="38" y="167" fill="#263746" font-size="25">每个粒子独立更新速度和位置</text>
<line x1="280" y1="196" x2="280" y2="211" stroke="#147d86" stroke-width="2"/>
<rect x="20" y="216" width="520" height="138" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="252" fill="#147d86" font-size="27">energy / 计算动能</text>
<text x="38" y="293" fill="#263746" font-size="25">使用刚更新的速度</text>
<text x="38" y="329" fill="#263746" font-size="25">每个粒子写自己的 energy</text>
<line x1="280" y1="358" x2="280" y2="373" stroke="#147d86" stroke-width="2"/>
<rect x="20" y="378" width="520" height="102" rx="12" fill="#ffffff" stroke="#d9e4eb"/>
<text x="38" y="414" fill="#147d86" font-size="27">total_energy / 求和</text>
<text x="38" y="455" fill="#263746" font-size="25">把全部 energy 加到 total.value</text>
<text x="22" y="520" fill="#657787" font-size="20">执行顺序示意 · 连线不表示耗时</text>
</svg>
