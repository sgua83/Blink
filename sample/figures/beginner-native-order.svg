<svg xmlns="http://www.w3.org/2000/svg" width="600" height="581"><rect width="600" height="581" rx="12" fill="#f5f9fa"/><text x="24" y="46" font-family="SimHei" font-size="30" fill="#147d86">同一条公式，两种推进方式</text><rect x="24" y="78" width="552" height="137" rx="12" fill="white" stroke="#c6d9dc"/><text x="42" y="114" font-family="SimHei" font-size="25" fill="#147d86">顺序：一步完成，再做下一步</text><text x="42" y="152" font-family="SimHei" font-size="26" fill="#263746">编号 0 → 1 → 2 → 3</text><text x="42" y="188" font-family="SimHei" font-size="26" fill="#263746">写入 2 → 4 → 6 → 8</text><rect x="24" y="235" width="552" height="173" rx="12" fill="white" stroke="#c6d9dc"/><text x="42" y="271" font-family="SimHei" font-size="25" fill="#147d86">并行：各位置的工作彼此独立</text><text x="42" y="309" font-family="SimHei" font-size="26" fill="#263746">编号   0      1      2      3</text><text x="42" y="345" font-family="SimHei" font-size="26" fill="#263746">value  1      2      3      4</text><text x="42" y="381" font-family="SimHei" font-size="26" fill="#263746">结果   2      4      6      8</text><rect x="24" y="428" width="552" height="101" rx="12" fill="white" stroke="#c6d9dc"/><text x="42" y="464" font-family="SimHei" font-size="25" fill="#147d86">读取：计算完成后，再顺序显示</text><text x="42" y="502" font-family="SimHei" font-size="26" fill="#263746">main 依次读回 2、4、6、8</text><text x="24" y="563" font-family="SimHei" font-size="18" fill="#637881">示意数据关系 · 不指定物理线程数量</text></svg>
