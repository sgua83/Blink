[package]
name = "blanguage"
version = "0.1.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bc"
required-features = ["compiler"]
path = "src/main.rs"

[[bin]]
name = "blink"
required-features = ["compiler"]
path = "src/bin/blink.rs"

[dependencies]
iced-x86 = { version = "1.21", optional = true, default-features = false, features = ["std", "decoder", "instr_info"] }

rspirv = { version = "0.13", optional = true, default-features = false }

[features]
default = ["compiler"]
compiler = ["dep:iced-x86", "dep:rspirv"]
installed = []
