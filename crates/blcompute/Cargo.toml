[package]
name = "blcompute"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "brun"
required-features = ["compiler"]
path = "src/main.rs"

[dependencies]
blanguage = { path = "../blanguage", default-features = false }

[features]
default = ["compiler"]
compiler = ["blanguage/compiler"]
